<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    :root {
      --blue: #89b4fa;
      --crust: #11111b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --blue: #1e66f5;
        --crust: #dce0e8;
      }
    }
    .bg { fill: var(--blue); }
    .icon { stroke: var(--crust); }
    .icon-fill { fill: var(--crust); }
  </style>
  <rect width="100" height="100" rx="22" class="bg" />
  <circle cx="50" cy="50" r="28" fill="none" class="icon" stroke-width="8" />
  <circle cx="50" cy="50" r="10" class="icon-fill" />
  <path d="M50 18 L50 34 M50 66 L50 82 M18 50 L34 50 M66 50 L82 50" class="icon" stroke-width="8" stroke-linecap="round" />
</svg>
