[workspace]
resolver = "2"
members = [
  "server",
  "shared",
  "sdk/rust",
  "client/src-tauri",
  "tools/test-setup",
  "tools/sdk-seed",
  "tools/register-bot",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
shared = { path = "shared" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
base64 = "0.22"
rand = "0.9"
hex = "0.4"
sqlx = { version = "0.8.3", features = ["sqlite", "runtime-tokio", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
